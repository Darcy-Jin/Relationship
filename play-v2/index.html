<style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#202124;background:#f4f0e8;--ink:#202124;--muted:#77736d;--paper:#fffdf9;--line:#ded8ce;--soft:#eee8df;--accent:#b96951}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;min-height:100dvh;background:radial-gradient(circle at top,#fbf8f2,#f4f0e8 55%,#ece6dd);-webkit-tap-highlight-color:transparent}button{font:inherit}
#app{min-height:100dvh}.game{min-height:100dvh;display:flex;flex-direction:column}.top{min-height:56px;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px}.brand{font-weight:800;letter-spacing:.08em;color:var(--ink)}.reset{border:0;background:transparent;color:var(--muted);padding:10px;cursor:pointer}.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:16px 16px calc(26px + env(safe-area-inset-bottom))}.screen{width:min(1080px,100%)}
.card{background:rgba(255,253,249,.98);border:1px solid rgba(70,60,48,.12);border-radius:26px;box-shadow:0 24px 70px rgba(66,52,37,.11);overflow:hidden}.center{min-height:620px;display:grid;place-items:center;padding:42px}.friend{width:min(430px,100%)}.who{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px}.bubble{max-width:84%;padding:13px 16px;border-radius:18px;line-height:1.65;margin:9px 0;background:#fff;border:1px solid var(--line);border-top-left-radius:6px}.bubble.me{margin-left:auto;background:#dfe9df;border:0;border-top-left-radius:18px;border-top-right-radius:6px}
.primary,.secondary,.choice,.person{min-height:48px;cursor:pointer;transition:.16s ease}.primary{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:14px 26px;font-weight:750}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:13px 22px}.primary:hover,.choice:hover,.person:hover{transform:translateY(-1px)}
.roster-head{margin-bottom:16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;color:var(--accent);margin-bottom:10px}.roster-head h1,.detail h1,.scene-copy h1,.end h1{font-family:Georgia,"Songti SC",serif;font-weight:500}.roster-head h1{font-size:clamp(34px,5vw,52px);margin:0}.roster-head p{color:var(--muted);margin:8px 0 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.person{padding:0;border:1px solid var(--line);border-radius:20px;background:var(--paper);text-align:left;overflow:hidden;color:var(--ink)}.person:hover{box-shadow:0 12px 32px rgba(64,50,35,.1)}
.art{height:220px;position:relative;overflow:hidden}.p1{background:linear-gradient(155deg,#768a86,#c6b09f)}.p2{background:linear-gradient(155deg,#b99372,#d7cbaa)}.p3{background:linear-gradient(155deg,#78627b,#c98b72)}.p4{background:linear-gradient(155deg,#657b68,#b0baa4)}.art:before{content:"";position:absolute;width:108px;height:108px;border-radius:50%;left:50%;top:34px;transform:translateX(-50%);background:#e5c7b2}.art:after{content:"";position:absolute;width:178px;height:144px;border-radius:90px 90px 20px 20px;left:50%;bottom:-16px;transform:translateX(-50%);background:rgba(255,255,255,.72)}.hair{position:absolute;width:116px;height:58px;border-radius:58px 58px 18px 18px;left:50%;top:25px;transform:translateX(-50%);background:#3e3935;z-index:2}.initial{position:absolute;left:50%;top:77px;transform:translateX(-50%);z-index:3;font:700 25px Georgia;color:rgba(75,51,40,.55)}.copy{padding:15px}.name-line{display:flex;align-items:baseline;justify-content:space-between}.copy h2{font:600 25px Georgia,"Songti SC",serif;margin:0}.age{font-size:13px;color:var(--muted)}.job{font-size:13px;margin:7px 0 9px;color:#4e4b47}.friend-line{font-size:13px;color:var(--muted);line-height:1.55;margin:0}
.detail{display:grid;grid-template-columns:.9fr 1.1fr;min-height:620px}.detail .art{height:100%;min-height:620px}.detail .art:before{width:170px;height:170px;top:110px}.detail .art:after{width:280px;height:250px;bottom:30px}.detail .hair{width:178px;height:88px;top:98px}.detail .initial{top:174px;font-size:38px}.detail-copy{padding:50px 46px;display:flex;flex-direction:column;justify-content:center}.detail h1{font-size:48px;margin:0 0 8px}.meta{color:var(--muted);margin-bottom:26px}.quote{font:500 20px/1.65 Georgia,"Songti SC",serif;border-left:3px solid var(--accent);padding-left:18px;margin:0 0 26px}.facts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}.fact{background:var(--soft);padding:8px 12px;border-radius:999px;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap}
.phone{width:min(700px,100%);margin:auto;min-height:590px;padding:22px;background:var(--paper);border:1px solid var(--line);border-radius:26px;box-shadow:0 24px 70px rgba(66,52,37,.11);display:flex;flex-direction:column}.phone-head{text-align:center;padding:2px 0 14px;border-bottom:1px solid var(--line);font-weight:700}.thread{flex:1;padding:20px 0}.choices{display:grid;gap:9px;margin-top:16px}.choice{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:14px 16px;text-align:left;line-height:1.5}
.scene{display:grid;grid-template-columns:minmax(320px,.9fr) 1.1fr;min-height:640px}.visual{position:relative;min-height:640px;overflow:hidden;background:linear-gradient(180deg,#cfd9d7 0 28%,#e8ddd0 28% 73%,#b89c7f 73%)}.window{position:absolute;left:28px;right:28px;top:34px;height:170px;border:9px solid rgba(255,255,255,.75);background:linear-gradient(#a9c2c8,#dfe8e7)}.table{position:absolute;width:300px;height:72px;border-radius:50%;left:50%;bottom:86px;transform:translateX(-50%);background:#8b684f;box-shadow:0 25px 0 -14px #604a3a}.figure{position:absolute;width:190px;height:320px;left:50%;bottom:98px;transform:translateX(-50%);z-index:2}.head{position:absolute;width:108px;height:118px;border-radius:50%;left:41px;top:16px;background:#e5c7b2}.figure .hair{top:7px}.body{position:absolute;width:180px;height:205px;border-radius:90px 90px 22px 22px;left:5px;bottom:0;background:#f7f3ed}.clock{position:absolute;top:18px;left:18px;background:rgba(255,253,249,.9);padding:8px 12px;border-radius:999px;font-size:12px;z-index:5}.scene-copy{padding:46px 42px;display:flex;flex-direction:column;justify-content:center}.progress{display:flex;gap:6px;margin-bottom:22px}.dot{width:28px;height:4px;background:#e2dbd2;border-radius:99px}.dot.on{background:var(--accent)}.scene-copy h1{font-size:clamp(31px,4vw,47px);margin:0 0 16px}.narration{line-height:1.8;color:#57544f;margin:0 0 18px}.dialogue{font:500 20px/1.7 Georgia,"Songti SC",serif;border-left:3px solid var(--accent);padding-left:18px;margin:2px 0 22px}.reply{background:#f2eee7;border-radius:16px;padding:15px 17px;line-height:1.65;margin-bottom:16px}
.end{min-height:620px;display:grid;grid-template-columns:.9fr 1.1fr}.end-art{display:grid;place-items:center;min-height:620px;background:linear-gradient(155deg,#8a9a94,#c8b09d);font:700 120px Georgia;color:rgba(255,255,255,.65)}.end-copy{padding:48px;display:flex;flex-direction:column;justify-content:center}.end h1{font-size:46px;margin:0 0 16px}.subtle{color:var(--muted);line-height:1.75}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.art{height:180px}.detail,.scene,.end{grid-template-columns:1fr}.detail .art{min-height:320px;height:320px}.detail .art:before{top:52px}.detail .art:after{bottom:-20px}.detail .hair{top:40px}.detail .initial{top:115px}.visual{min-height:320px}.figure{bottom:34px;transform:translateX(-50%) scale(.78);transform-origin:bottom}.table{bottom:32px}.end-art{min-height:290px}}
@media(max-width:600px){.top{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}.stage{align-items:flex-start;padding:8px 0 calc(18px + env(safe-area-inset-bottom))}.screen{width:100%}.card,.phone{border-left:0;border-right:0;border-radius:0;box-shadow:none}.center{min-height:calc(100dvh - 68px);padding:26px 18px}.grid{gap:8px;padding:0 9px}.roster-head{padding:10px 13px 2px}.roster-head h1{font-size:31px}.art{height:145px}.art:before{width:74px;height:74px;top:23px}.art:after{width:122px;height:100px}.hair{width:80px;height:42px;top:18px}.initial{top:55px;font-size:20px}.copy{padding:10px}.copy h2{font-size:21px}.job{font-size:12px}.friend-line{font-size:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail-copy{padding:26px 18px 32px}.detail h1{font-size:38px}.quote{font-size:18px}.actions{display:grid;grid-template-columns:1fr}.primary,.secondary{width:100%;min-height:52px}.phone{min-height:calc(100dvh - 68px);padding:18px 13px calc(24px + env(safe-area-inset-bottom))}.visual{min-height:255px}.figure{bottom:18px;transform:translateX(-50%) scale(.68)}.table{width:230px;bottom:20px}.scene-copy{padding:24px 17px 30px}.scene-copy h1{font-size:30px}.dialogue{font-size:18px}.choice{min-height:54px}.end-art{min-height:230px;font-size:88px}.end-copy{padding:28px 18px 36px}.end h1{font-size:37px}}
@media(hover:none){.primary:hover,.choice:hover,.person:hover{transform:none}}
</style>

<main id="app"></main>
<script>
const people=[
{id:"1",name:"林序",age:32,job:"互联网公司 · 业务负责人",tone:"p1",friend:"“工作是忙一点，不过人做事挺靠谱的。”",facts:["周末跑步","偶尔出差","朋友不算多"],hello:"你好，我是林序。朋友把你的微信推给我了。",invite:"你这周六下午有空吗？我过去找你也行，你看哪边方便。",beats:[
["周六 15:02","第一次见面","你进店的时候，他已经到了。看到你以后，他站起来，把菜单往你这边推了一点。","“你好。我也刚到一会儿，你看看想喝什么，我还没点。”",null],
["周六 15:15","刚坐下来","前几分钟都是很普通的聊天。过了一会儿，他自己先笑了。","“我其实很久没相亲了。刚才路上还在想，等下第一句到底要说什么。”",[["“那你刚才表现得还挺自然。”","“装得还行是吧。” 他笑了。"],["“我也不知道这种场合应该聊什么。”","“那挺好，至少不是我一个人尴尬。”"],["“不用想那么多，就正常聊呗。”","“也是。反正今天先认识一下。”"]]],
["周六 15:38","聊到周末","他说早上刚跑完步，平时脑子一直在转，跑步的时候反而不用想事情。","“你周末一般怎么过？”",[["“有时候会约朋友出去。”","“那挺好。我朋友不算多，通常就那几个。”"],["“我挺喜欢一个人待着的。”","“我也需要一点自己待着的时间。”"],["“不一定，到周末再看。”","“那你比我随性。我不安排的话，最后大概率还是在工作。”"]]],
["周六 16:07","电话响了第二次","他的手机刚才已经亮过一次。这次直接响了。他看了一眼来电，没有马上接。","“不好意思，是同事。我接一下可以吗？应该两分钟。”",[["“你接吧。”","他点点头：“抱歉。” 然后走到店门口。"],["“周末也会找你？”","“偶尔。我先接一下，回来跟你说。”"],["“你要是有急事就先处理，不用顾着我。”","“没那么严重。两分钟。”"]],"大约三分钟以后，他回来坐下，把手机调成静音。“抱歉，比我说的多了一分钟。线上有点问题，不过他们能处理。”"],
["周六 16:12","回来以后","他自己把刚才的话接了下去。","“以前什么都自己顶，后来发现这样没完。现在能交给别人的，我尽量不自己顶。”",[["“听起来你还是挺忙的。”","“忙是真的，不过跟前两年比好多了。”"],["“至少你知道不能什么都自己扛。”","“吃过亏才知道。”"],["“我会比较介意约好的时间一直被工作打断。”","他停了一下：“这个我能理解。今天这次确实算我这边的问题。”"]]],
["傍晚","准备分别","后面又聊了一阵。没有一直聊工作，也没有特别讨论合不合适。从店里出来时，天已经快黑了。","“今天聊得挺舒服的。路上注意。”",null]],final:"今天挺开心的。我下周二三要出差，回来以后如果你有空，再一起吃个饭？"},
{id:"2",name:"周宁",age:31,job:"国企 · 项目经理",tone:"p2",friend:"“人挺稳的，日子也过得很细，周末基本不加班。”",facts:["会做饭","周末少加班","喜欢规律生活"],hello:"你好，我是周宁。朋友说你最近也在这边工作。",invite:"这周末有空吗？我知道一家不太吵的店，可以一起吃个午饭。",beats:[
["周日 12:01","第一次见面","他提前到了十来分钟，桌上放着两杯水。你坐下以后，他把其中一杯推过来。","“我没敢替你点喝的，怕点错。你看看菜单。”",null],
["周日 12:18","聊到吃饭","菜单翻到甜品那页，他看得比你认真。","“我平时还挺喜欢做饭的。不是多厉害，就是觉得自己做比较舒服。”",[["“那挺好，我很喜欢会做饭的人。”","“先别夸，能吃和好吃还是两回事。”"],["“我做饭很一般。”","“那也没关系，谁想做谁做。”"],["“我更喜欢出去吃。”","“也挺好，少洗碗。”"]]],
["周日 12:42","聊到周末","他说自己周末很少处理工作，通常会买菜、运动，偶尔和朋友出去。","“我可能有点固定。你会不会觉得这种生活太平了？”",[["“我觉得挺舒服。”","“那至少不会天天临时改计划。”"],["“偶尔还是要有点新鲜东西。”","“这个可以，我只是不会每周都临时起意。”"],["“我还真有点怕太固定。”","“能理解，有的人就是会觉得闷。”"]]],
["周日 13:10","临时换位置","店员过来说靠窗这一区域要维修，问你们能不能换到里面。周宁先看了看你。","“里面可能有点吵。要不换一家也行，你想怎么弄？”",[["“就换里面吧，没事。”","“行，那我们搬一下。”"],["“那换一家？”","“可以，附近还有一家。”"],["“你决定吧。”","“那先去里面，不舒服我们再走。”"]],"换好位置后，他先确认了一下你坐着会不会太挤，又把包放到自己这边。"],
["下午","准备分别","吃完以后他陪你走到路口，没有顺势安排下一场。","“今天挺自然的。我回去把那家店的名字发你。”",null]],final:"刚才说的那家面包店我找到了。下次有空的话可以一起去，不急。"},
{id:"3",name:"许澈",age:30,job:"创业公司 · 联合创始人",tone:"p3",friend:"“人特别有意思，朋友很多，就是生活比较随性。”",facts:["朋友很多","爱旅行","计划经常临时变"],hello:"嗨，我是许澈。朋友说我们俩应该挺能聊。",invite:"周五晚上有空吗？先吃个饭，吃完看心情再决定去哪。",beats:[
["周五 19:00","第一次见面","他几乎是踩着点进来的，进门以后先朝你笑了一下。","“还好没迟到。我刚刚差点坐过站。”",null],
["周五 19:14","聊到旅行","他很快聊到最近一次旅行，还翻出一张很离谱的照片给你看。","“我出门基本不做特别细的攻略，不然会觉得像上班。”",[["“我也喜欢随便走走。”","“对吧，很多最好玩的都是临时遇到的。”"],["“我还是会提前安排一点。”","“可以理解，我这种也经常把同行的人搞崩。”"],["“我会很怕计划全乱。”","“那跟我出门可能要先做好心理准备。”"]]],
["周五 19:40","聊到朋友","他说最近几周末几乎都有朋友约，认识的人听起来很多。","“我挺喜欢人多一点的生活。你呢？”",[["“我也挺喜欢热闹。”","“那应该不会没地方去。”"],["“我看状态，有时候想安静。”","“这个我也有，只是比较少。”"],["“我其实不太喜欢太多社交。”","“那我们这点可能差得有点多。”"]]],
["周五 20:05","朋友就在附近","吃到一半，他收到消息。一个朋友刚好在隔壁街，问要不要过来坐会儿。","“他们就在附近。你要是不想，我就直接说今天不方便。”",[["“来就来吧。”","“行，我让他们只坐一会儿。”"],["“我更想今天就我们两个。”","“好，那不叫。他们什么时候都能见。”"],["“你们平时都这么临时吗？”","“挺经常的。你是不是不太喜欢这种？”"]],"他没有先答应朋友，而是等你说完以后才回复消息。"],
["晚上","准备分别","从店里出来以后，他问你要不要再走一段。你们又聊了十来分钟。","“今天比我想象中轻松。”",null]],final:"我下周发现一个挺有意思的展，要不要一起去？不喜欢展的话就吃饭。"},
{id:"4",name:"沈知",age:31,job:"软件公司 · 工程师",tone:"p4",friend:"“第一眼可能没那么抢眼，慢热一点，但人做事挺稳。”",facts:["慢热","固定健身","在学新方向"],hello:"你好，我是沈知。朋友刚把你的联系方式发给我。",invite:"你周六下午方便吗？我找了一家安静一点的店。",beats:[
["周六 14:58","第一次见面","他比约定时间早到了几分钟。你坐下后，他把手机收进包里。","“你好。这里应该不会太吵，我第一次来。”",null],
["周六 15:13","刚坐下来","他话不算多，但你说完以后通常会继续追问，而不是马上讲自己。","“我可能不太会把气氛弄得很热闹。你会觉得尴尬吗？”",[["“不会，我觉得挺舒服。”","他明显松了一点：“那就好。”"],["“有一点，不过聊开就好了。”","“我也是，前十分钟最难。”"],["“我确实更喜欢活跃一点的人。”","“明白，这个我可能装不太出来。”"]]],
["周六 15:36","聊到最近在做什么","他说下班后在学一个新的技术方向，进度不算快。","“我现在工作挺稳定，但不太想一直停在这。你下班以后一般还会折腾别的吗？”",[["“会，我也有自己的事情。”","“那挺好，我很喜欢两个人都有自己的东西。”"],["“下班以后我就想休息。”","“也正常，我有时候也会完全不想动。”"],["“看阶段，忙的时候不会。”","“对，硬撑也没什么意思。”"]]],
["周六 16:01","服务员上错了单","服务员把旁边桌的甜品放到了你们这里，发现以后连着道歉。沈知先把盘子递回去。","“没事，我们也还没动。”",[["“还好没吃。”","他笑了一下：“不然就更尴尬了。”"],["“你脾气好像挺好的。”","“这种事没必要生气吧。”"],["“我都没发现上错了。”","“我也是看了半天才觉得不对。”"]],"服务员走后，他没有继续评价这件事，很自然地接回刚才的话题。"],
["傍晚","准备分别","分别前，他没有立刻安排下一次，只陪你走到地铁口。","“今天我挺开心的。如果你也觉得还不错，我们再约。”",null]],final:"到家了吗？今天谢谢你。下次如果你想见，我来找地方。"}];
const state={screen:"intro",id:null,beat:0,reply:null,decision:null};
const q=s=>document.querySelector(s);const current=()=>people.find(p=>p.id===state.id);
function shell(html,phase){document.getElementById("app").innerHTML="<div class='game'><header class='top'><div class='brand'>RELATIONSHIP</div><div>"+phase+"</div><button class='reset' id='reset'>重新开始</button></header><section class='stage'><div class='screen'>"+html+"</div></section></div>";q("#reset").onclick=reset}
function reset(){Object.assign(state,{screen:"intro",id:null,beat:0,reply:null,decision:null});render()}
function art(p){return "<div class='art "+p.tone+"'><div class='hair'></div><div class='initial'>"+p.name.slice(0,1)+"</div></div>"}
function intro(){shell("<div class='card center'><div class='friend'><div class='who'>朋友</div><div class='bubble'>最近认识了几个还不错的，要不要看看？</div><div style='margin-top:22px'><button class='primary' id='look'>看看</button></div></div></div>","开始");q("#look").onclick=()=>{state.screen="roster";render()}}
function roster(){shell("<div><div class='roster-head'><div class='eyebrow'>朋友发来了 4 个人</div><h1>你看看。</h1><p>有哪个想见见的，就点进去。</p></div><div class='grid'>"+people.map(p=>"<button class='person' data-id='"+p.id+"'>"+art(p)+"<div class='copy'><div class='name-line'><h2>"+p.name+"</h2><span class='age'>"+p.age+"</span></div><div class='job'>"+p.job+"</div><p class='friend-line'>"+p.friend+"</p></div></button>").join("")+"</div></div>","看看人");document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{state.id=b.dataset.id;state.screen="detail";render()})}
function detail(){const p=current();shell("<div class='card detail'><div>"+art(p)+"</div><div class='detail-copy'><div class='eyebrow'>朋友介绍</div><h1>"+p.name+" <span class='age'>"+p.age+"</span></h1><div class='meta'>"+p.job+"</div><p class='quote'>"+p.friend+"</p><div class='facts'>"+p.facts.map(x=>"<span class='fact'>"+x+"</span>").join("")+"</div><div class='actions'><button class='primary' id='meet'>见见他</button><button class='secondary' id='back'>再看看其他人</button></div></div></div>","看看人");q("#meet").onclick=()=>{state.screen="schedule";render()};q("#back").onclick=()=>{state.screen="roster";render()}}
function schedule(){const p=current();shell("<div class='phone'><div class='phone-head'>"+p.name+"</div><div class='thread'><div class='bubble'>"+p.hello+"</div><div class='bubble'>"+p.invite+"</div><div class='choices'><button class='choice'>周六下午可以</button><button class='choice'>市中心都方便，你定吧</button><button class='choice'>周六不太方便，周日呢？</button></div></div></div>","约时间");document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{state.screen="date";state.beat=0;state.reply=null;render()})}
function visual(t){return "<div class='visual'><div class='clock'>"+t+"</div><div class='window'></div><div class='table'></div><div class='figure'><div class='head'></div><div class='hair'></div><div class='body'></div></div></div>"}
function progress(n,total){let s="<div class='progress'>";for(let i=0;i<=total;i++)s+="<span class='dot "+(i<=n?"on":"")+"'></span>";return s+"</div>"}
function date(){const p=current();if(state.beat>=p.beats.length){state.screen="message";render();return}const b=p.beats[state.beat];const choices=b[4];let act="";if(choices){if(state.reply===null){act="<div class='choices'>"+choices.map((x,i)=>"<button class='choice' data-choice='"+i+"'>"+x[0]+"</button>").join("")+"</div>"}else{act="<div class='reply'>"+choices[state.reply][1]+"</div>"+(b[5]?"<p class='narration'>"+b[5]+"</p>":"")+"<button class='primary' id='next'>继续</button>"}}else{act="<button class='primary' id='next'>"+(state.beat===0?"坐下聊聊":"继续")+"</button>"}shell("<div class='card scene'>"+visual(b[0])+"<div class='scene-copy'>"+progress(state.beat,p.beats.length)+"<div class='eyebrow'>"+p.name+"</div><h1>"+b[1]+"</h1><p class='narration'>"+b[2]+"</p><div class='dialogue'>"+b[3]+"</div>"+act+"</div></div>","相亲中");if(q("#next"))q("#next").onclick=()=>{state.beat++;state.reply=null;render()};document.querySelectorAll("[data-choice]").forEach(x=>x.onclick=()=>{state.reply=Number(x.dataset.choice);render()})}
function message(){const p=current();shell("<div class='phone'><div class='phone-head'>"+p.name+"</div><div class='thread'><div class='bubble'>"+p.final+"</div><div class='choices'><button class='choice' data-d='YES'>“好啊，下次再约。”</button><button class='choice' data-d='MAYBE'>“可以，到时候看看时间。”</button><button class='choice' data-d='NO'>“今天谢谢你，不过我感觉可能不太合适。”</button></div></div></div>","晚上");document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{state.decision=b.dataset.d;state.screen="end";render()})}
function end(){const p=current();const txt=state.decision==="YES"?"你答应了下一次见面。":state.decision==="MAYBE"?"你没有拒绝，也没有急着决定。":"你决定到这里就好。";shell("<div class='card end'><div class='end-art'>"+p.name.slice(0,1)+"</div><div class='end-copy'><div class='eyebrow'>第一次相亲结束</div><h1>"+txt+"</h1><p class='subtle'>先停在这里。没有匹配分，也没有分析你为什么这么选。</p><div class='actions' style='margin-top:24px'><button class='primary' id='another'>再见另一个人</button><button class='secondary' id='again'>重新开始</button></div></div></div>","结束");q("#another").onclick=()=>{state.screen="roster";state.beat=0;state.reply=null;state.decision=null;render()};q("#again").onclick=reset}
function render(){({intro,roster,detail,schedule,date,message,end}[state.screen]||intro)()}render();
</script>
</body>
</html>
