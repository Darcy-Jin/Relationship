name: Test Relationship

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax check server
        run: node --check scripts/serve.mjs

      - name: Syntax check player modules
        run: |
          for file in play/*.js; do
            node --check "$file"
          done

      - name: Run tests
        run: npm test
